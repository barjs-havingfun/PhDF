[project]
name = "phdf"
version = "0.6.0"
description = "A lightweight, reader-first PDF app with Markdown and Obsidian integration."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "psutil>=7.2.2",
    "ptyprocess>=0.7 ; sys_platform != 'win32'",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=0.3.4,<1",
    "pywebview>=6.2.1",
    "pywebview[gtk]>=6.2.1; sys_platform == 'linux'",
    "pywinpty>=2.0 ; sys_platform == 'win32'",
]

[project.scripts]
phdf = "phdf.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/phdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
