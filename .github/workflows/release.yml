name: Release

# Push a tag like v0.7.0 to build PhDF for Windows (installer + zip), macOS (.dmg) and Linux
# (AppImage) and make one draft GitHub Release with all files and SHA256SUMS.txt. Check the
# draft on GitHub, then publish it. Windows files are signed once SignPath is set up
# (CODE_SIGNING_POLICY.md); until then everything is unsigned.
# A manual run (Actions → Release → Run workflow) builds everything as artifacts only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release

env:
  # SignPath is used only when this repository variable exists.
  SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, test and build
        run: |
          uv sync --locked
          npm --prefix frontend ci
          uv run pytest
          npm --prefix frontend test
          npm --prefix frontend run build
          uv run pyinstaller phdf.spec --noconfirm

      - name: Upload the unsigned app (input for signing)
        id: unsigned
        uses: actions/upload-artifact@v6
        with:
          name: windows-unsigned
          path: dist/PhDF/

      - name: Sign PhDF.exe with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: PhDF
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Installer and zip
        shell: pwsh
        run: |
          $app = if (Test-Path signed-app/PhDF.exe) { (Resolve-Path signed-app).Path } else { (Resolve-Path dist/PhDF).Path }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$app" packaging\windows\phdf.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item "dist/PhDF-$env:VERSION-setup.exe" out/
          Compress-Archive -Path $app -DestinationPath "out/PhDF-$env:VERSION-windows-portable.zip"

      # Install it the way users do, then check the installed app: the self-test (documents,
      # rendering, saving, the terminal), then --smoke-ui: the real window opens a PDF and only
      # passes once a page image is on screen (a blank window or a broken bridge fails).
      - name: Test the installed app
        shell: pwsh
        env:
          PHDF_DATA_DIR: ${{ runner.temp }}/phdf-data
        run: |
          $dir = "$env:RUNNER_TEMP\PhDF-installed"
          $setup = (Resolve-Path "out/PhDF-$env:VERSION-setup.exe").Path
          $install = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"" -Wait -PassThru
          if ($install.ExitCode) { throw "The installer failed (exit $($install.ExitCode))" }
          $test = Start-Process "$dir\PhDF.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:PHDF_DATA_DIR\self-test.txt"
          if ($test.ExitCode) { throw "The self-test failed" }
          $pdf = "$env:PHDF_DATA_DIR\smoke.pdf"
          $app = Start-Process "$dir\PhDF.exe" -ArgumentList "--smoke-ui", "`"$pdf`"" -PassThru
          $null = $app.Handle # else ExitCode stays empty
          if (-not $app.WaitForExit(120000)) { Stop-Process -Id $app.Id -Force; throw "PhDF never showed the PDF (2 min)" }
          Get-Content "$env:PHDF_DATA_DIR\ui-ready.json" -ErrorAction SilentlyContinue
          if ($app.ExitCode) { throw "PhDF started but did not show the PDF (exit $($app.ExitCode))" }
          "PhDF opened and showed a PDF"

      - name: Upload the unsigned installer (input for signing)
        id: setup
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: windows-setup-unsigned
          path: out/PhDF-${{ env.VERSION }}-setup.exe

      - name: Sign the installer with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: PhDF
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-setup
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out

      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: out/

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build
        run: |
          uv sync --locked
          npm --prefix frontend ci
          uv run pytest
          npm --prefix frontend test
          npm --prefix frontend run build
          uv run pyinstaller phdf.spec --noconfirm

      - name: Test the app (self-test, then the window opens and shows a PDF)
        env:
          PHDF_DATA_DIR: ${{ runner.temp }}/phdf-data
        run: |
          dist/PhDF.app/Contents/MacOS/PhDF --self-test
          # No `timeout` on macOS runners: perl's alarm stops a hung start after 2 minutes.
          perl -e 'alarm shift; exec @ARGV' 120 dist/PhDF.app/Contents/MacOS/PhDF --smoke-ui "$PHDF_DATA_DIR/smoke.pdf"
          echo "PhDF opened and showed a PDF"
          # Which CPUs the app runs on, and the oldest macOS it allows (both shown in the log).
          lipo -archs dist/PhDF.app/Contents/MacOS/PhDF
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" dist/PhDF.app/Contents/Info.plist

      # Unsigned for now: users open it once with right-click → Open (see the release notes).
      - name: Disk image (.dmg) with an Applications shortcut
        run: |
          mkdir -p out dmg
          cp -R dist/PhDF.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname PhDF -srcfolder dmg -ov -format UDZO "out/PhDF-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: release-macos
          path: out/

  linux:
    needs: version
    runs-on: ubuntu-22.04 # older glibc: the AppImage runs on more distributions
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: System packages (GTK / WebKit2 for pywebview, FUSE-free AppImage tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gobject-introspection libcairo2-dev \
            pkg-config gir1.2-webkit2-4.1 gir1.2-freedesktop file
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build
        run: |
          uv sync --locked
          npm --prefix frontend ci
          uv run pytest
          npm --prefix frontend test
          npm --prefix frontend run build
          uv run pyinstaller phdf.spec --noconfirm
          bash packaging/linux/build_appimage.sh "$VERSION"
          mkdir -p out && mv dist/PhDF-*.AppImage out/

      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: out/

  # Does the AppImage work on other distributions? With only the packages the release notes ask
  # for: the self-test, then --smoke-ui on a virtual screen (the window must show a PDF page).
  # A failure here stops the release.
  linux-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            setup: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y gir1.2-webkit2-4.1 xvfb libgl1-mesa-dri libegl-mesa0
          - name: Fedora
            image: fedora:latest
            setup: dnf install -y gtk3 webkit2gtk4.1 xorg-x11-server-Xvfb mesa-dri-drivers mesa-libEGL
          - name: Arch
            image: archlinux:latest
            setup: pacman -Syu --noconfirm gtk3 webkit2gtk-4.1 xorg-server-xvfb mesa
    name: Start on ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-linux
      - run: ${{ matrix.setup }}
      - name: Self-test, then open a PDF in the window
        shell: bash
        env:
          PHDF_DATA_DIR: /tmp/phdf
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1" # containers have no user namespaces
          # Containers have no session / accessibility bus or GPU, which a desktop always has:
          # GTK would wait for the bus, and WebKit should draw in software.
          NO_AT_BRIDGE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          XDG_RUNTIME_DIR: /tmp/xdg-runtime
        run: |
          chmod +x PhDF-*.AppImage
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          Xvfb :99 -screen 0 1400x900x24 & export DISPLAY=:99; sleep 2
          ./PhDF-*.AppImage --appimage-extract-and-run --self-test || { echo "The self-test failed"; exit 1; }
          set +e
          timeout 120 ./PhDF-*.AppImage --appimage-extract-and-run --smoke-ui "$PHDF_DATA_DIR/smoke.pdf" > log.txt 2>&1
          code=$?
          cat log.txt
          if [ $code -ne 0 ]; then echo "PhDF did not open and show the PDF (exit $code)"; exit 1; fi
          echo "PhDF opened and showed a PDF"

  # Drafted only when every build and every test above passed.
  release:
    needs: [version, windows, macos, linux, linux-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: files

      - name: Checksums
        run: cd files && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: PhDF ${{ github.ref_name }}
          files: files/*
          body: |
            ## Download
            - **Windows:** `PhDF-${{ needs.version.outputs.version }}-setup.exe` (installer), or the portable zip.
            - **macOS:** `PhDF-${{ needs.version.outputs.version }}-macos.dmg`. Drag PhDF to Applications. The app isn't signed by Apple yet: the first time, right-click PhDF → Open → Open (or System Settings → Privacy & Security → Open Anyway).
            - **Linux:** `PhDF-${{ needs.version.outputs.version }}-x86_64.AppImage`: `chmod +x` it and run. Needs GTK and WebKitGTK 4.1: `gir1.2-webkit2-4.1` on Ubuntu / Debian, `webkit2gtk4.1` on Fedora, `webkit2gtk-4.1` on Arch. If double-clicking does nothing, install `libfuse2` (`libfuse2t64` on Ubuntu 24.04) or start it with `--appimage-extract-and-run`.

            Check downloads with `SHA256SUMS.txt`. ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'Windows files: free code signing provided by SignPath.io, certificate by SignPath Foundation.' || 'Windows files are not signed yet: SmartScreen may warn, choose More info → Run anyway.' }}

            ## What's new
            (write the changes here before publishing)

      - name: Files (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v6
        with:
          name: PhDF-all
          path: files/
