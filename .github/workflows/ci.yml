name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # macOS and Linux are experimental until the end of Phase 1 (HANDOFF.md, D8).
    continue-on-error: ${{ matrix.os != 'windows-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system packages (GTK / WebKit2 for pywebview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # pygobject 3.50 (from pywebview[gtk]) builds against girepository 1.0; newer ones use 2.0.
          sudo apt-get install -y libgirepository1.0-dev libgirepository-2.0-dev gobject-introspection \
            libcairo2-dev pkg-config gir1.2-webkit2-4.1

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked
          npm --prefix frontend ci

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          npm --prefix frontend run check

      - name: Test
        run: uv run pytest

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Package
        run: uv run pyinstaller phdf.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: PhDF-${{ runner.os }}
          path: dist/
